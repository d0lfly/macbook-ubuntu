# macOS 风格快捷键（配合 keyd：内核层把 ⌘+X 翻译成 Ctrl+X）
# 因此这里用 ctrl+ 接收 ⌘，用 ctrl+shift+ 接收 ⌘⇧

# —— 剪贴板：⌘C 复制 / ⌘V 粘贴 ——
# copy_or_interrupt：有选区时复制，无选区时仍发送 Ctrl+C 中断（最贴近 macOS）
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# —— 标签 / 窗口：⌘⇧T / ⌘⇧W / ⌘⇧N ——
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+n new_window

# —— 切换标签：⌘1..⌘9、⌘⇧[ / ⌘⇧] ——
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+shift+bracketleft previous_tab
map ctrl+shift+bracketright next_tab

# —— 搜索 / 清屏：⌘⇧F / ⌘⇧K ——
map ctrl+shift+f search
map ctrl+shift+k clear_terminal scrollback

# —— 字号：⌘- / ⌘= / ⌘0 ——
map ctrl+minus decrease_font_size
map ctrl+equal increase_font_size
map ctrl+0 reset_font_size

# —— 全屏：⌃⌘F（与 GNOME 一致）——
map ctrl+super+f toggle_fullscreen
