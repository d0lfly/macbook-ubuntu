# macOS 风格 Command 键映射（Ubuntu 26.04 / GNOME 50 / Wayland）
#
# 两条硬性写法约束（踩过坑）：
#   1. 注释必须独占一行。keyd 的 ini 解析器只把「行首第一个非空白字符是 #」
#      的行当注释，写成 `k = C-l  # 说明` 会让整行绑定解析失败并报
#      ERROR: line N: invalid key or action。
#   2. 注释里别用 U+2318 符号，全文用 Super+ / Shift+ / Alt+ / Ctrl+ 表示。
#
# 设计原则：
#   * Super 保留为 Meta，GNOME 的概览 / Super+Tab / Super+Space 不受影响。
#   * 只把 Super+某键 翻译成应用真正认的 Ctrl(+Shift)(+Alt)+某键。
#   * keyd 的复合层（meta+shift / meta+alt / control+meta）优先级高于
#     [meta] 层，但【没有绑定时会回落到 [meta] 层并丢掉 Shift/Alt】。
#     所以凡是要交还给 GNOME 的组合（Ctrl+Super+F 全屏、Super+Shift+3/4
#     截图）必须在复合层里显式用 M- / M-S- 前缀重新发出去，否则会被吞掉。
#
# 生效：sudo systemctl restart keyd（不要用 reload）
# 备份：~/.local/share/keyboard-backup/

[ids]
*

# ======================================================== Super =====
[meta:M]

# --- 编辑 / 剪贴板 ---
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
s = C-s
f = C-f
p = C-p

# --- 文件 / 标签页 / 应用 ---
t = C-t
n = C-n
o = C-o
w = C-w
q = C-q
k = C-k
comma = C-comma

# --- 浏览 ---
# Super+L 聚焦地址栏 / Super+D 收藏 / Super+G 查找下一个 / Super+J 下载
l = C-l
d = C-d
g = C-g
j = C-j
e = C-e
u = C-u
r = C-r
b = C-b
i = C-i
y = C-y
leftbrace = C-leftbrace
rightbrace = C-rightbrace
grave = C-S-tab
minus = C-minus
equal = C-equal
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0

# --- 行编辑 ---
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# =================================================== Super+Shift ====
[meta+shift]
t = C-S-t
w = C-S-w
n = C-S-n
r = C-S-r
d = C-S-d
b = C-S-b
o = C-S-o
a = C-S-a
g = C-S-g
c = C-S-c
i = C-S-i
j = C-S-j
v = C-S-v
f = C-S-f
k = C-S-k
leftbrace = C-S-leftbrace
rightbrace = C-S-rightbrace
delete = C-S-delete
3 = M-S-3
4 = M-S-4
left = M-S-left
right = M-S-right

# ===================================================== Alt+Super ====
[meta+alt]
i = C-S-i
c = C-S-c
j = C-S-j
f = C-S-f
1 = C-A-1
2 = C-A-2
3 = C-A-3
4 = C-A-4
5 = C-A-5
6 = C-A-6
7 = C-A-7
8 = C-A-8

# ==================================================== Ctrl+Super ====
[control+meta]
f = M-C-f
left = M-C-left
right = M-C-right
